name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'images.txt'
      - 'scripts/**'
      - '.github/workflows/docker.yaml'

permissions:
  contents: read

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 增加可用磁盘空间
    - name: Maximize build space
      uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
      with:

        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        # 如果空间还是不够用，可以把以下开启，清理出更多空间
        # remove-android: 'true'
        # remove-codeql: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Aliyun Registry
      env:
        ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
        ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
        ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
      run: |
        echo "$ALIYUN_REGISTRY_PASSWORD" |
          docker login --username "$ALIYUN_REGISTRY_USER" \
            --password-stdin "$ALIYUN_REGISTRY"

    - name: Sync Images
      env:
        ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
        ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
      run: bash scripts/sync-images.sh images.txt
